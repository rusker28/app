<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de Factores Financieros</title>
</head>
<body>
    <h2>Calculadora de Factores Financieros</h2>
    <form method="post">
        Tasa de interés (%): <input type="number" step="0.01" name="interes" required><br><br>
        Número de periodos: <input type="number" name="periodos" required><br><br>
        <input type="submit" value="Calcular">
    </form>

    {% if resultados %}
        <h3>Resultados:</h3>
        <ul>
            {% for clave, valor in resultados.items() %}
                <li>{{ clave }}: {{ valor }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
